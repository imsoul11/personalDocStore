swagger: "2.0"
info:
  title: docstore API
  version: "1.0"
basePath: /
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json

paths:
  /users/register:
    post:
      summary: Register a new user
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password]
            properties:
              email:    { type: string, format: email }
              password: { type: string }
      responses:
        201:
          description: Created
          schema:
            $ref: '#/definitions/AckResponse'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorResponse'
        409:
          description: Email already exists
          schema:
            $ref: '#/definitions/ErrorResponse'

  /users/login:
    post:
      summary: Login
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password]
            properties:
              email:    { type: string, format: email }
              password: { type: string }
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Invalid credentials
          schema:
            $ref: '#/definitions/ErrorResponse'

  /users/profile:
    get:
      summary: Get current user profile
      produces: [application/json]
      security:
        - Bearer: []
      responses:
        200:
          description: Profile details
          schema:
            $ref: '#/definitions/UserProfileResponse'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
    post:
      summary: Update user profile
      consumes: [application/json]
      produces: [application/json]
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              name:    { type: string }
              address: { type: string }
              dob:     { type: string, format: date }
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/AckResponse'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'

  /documents:
    post:
      summary: Upload document
      consumes: [multipart/form-data]
      produces: [application/json]
      security:
        - Bearer: []
      parameters:
        - in: formData
          name: file
          type: file
          required: true
          description: The document file to upload
        - in: formData
          name: filename
          type: string
          description: Optional filename override
      responses:
        201:
          description: Created
          schema:
            $ref: '#/definitions/DocumentCreatedResponse'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
    get:
      summary: List documents for the current user
      produces: [application/json]
      security:
        - Bearer: []
      parameters:
        - in: query
          name: limit
          type: integer
          format: int64
          minimum: 1
          description: Maximum number of documents to return
        - in: query
          name: offset
          type: integer
          format: int64
          minimum: 0
          description: Number of documents to skip
      responses:
        200:
          description: List of documents
          schema:
            $ref: '#/definitions/DocumentsListResponse'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'

  /documents/{id}:
    get:
      summary: Get document by ID
      produces: [application/json]
      security:
        - Bearer: []
      parameters:
        - in: path
          name: id
          type: integer
          format: int64
          required: true
          description: Document ID
      responses:
        200:
          description: Document details
          schema:
            $ref: '#/definitions/DocumentResponse'
        404:
          description: Not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'

definitions:
  Document:
    type: object
    required: [id, user_id, filename, status, created_at]
    properties:
      id:
        type: integer
        format: int64
      user_id:
        type: integer
        format: int64
      filename:
        type: string
      status:
        type: string
        example: uploaded
        enum: [uploaded, processing, completed, failed]
      created_at:
        type: string
        format: date-time

  DocumentCreatedResponse:
    type: object
    required: [success, acknowledgement, document]
    properties:
      success:
        type: boolean
        example: true
      acknowledgement:
        type: string
        example: Document uploaded and queued for processing
      document:
        $ref: '#/definitions/Document'

  DocumentResponse:
    type: object
    required: [success, acknowledgement, document]
    properties:
      success:
        type: boolean
        example: true
      acknowledgement:
        type: string
        example: Document fetched successfully
      document:
        $ref: '#/definitions/Document'

  DocumentsListResponse:
    type: object
    required: [success, acknowledgement, documents]
    properties:
      success:
        type: boolean
        example: true
      acknowledgement:
        type: string
        example: Documents fetched successfully
      documents:
        type: array
        items:
          $ref: '#/definitions/Document'

  AckResponse:
    type: object
    required: [success, acknowledgement]
    properties:
      success:
        type: boolean
        example: true
      acknowledgement:
        type: string
        example: Request processed successfully

  LoginResponse:
    type: object
    required: [success, acknowledgement, token]
    properties:
      success:
        type: boolean
        example: true
      acknowledgement:
        type: string
        example: Login successful
      token:
        type: string

  UserProfile:
    type: object
    required: [id, email, created_at]
    properties:
      id:
        type: integer
        format: int64
      email:
        type: string
        format: email
      name:
        type: string
      dob:
        type: string
      address:
        type: string
      created_at:
        type: string
        format: date-time

  UserProfileResponse:
    type: object
    required: [success, acknowledgement, user]
    properties:
      success:
        type: boolean
        example: true
      acknowledgement:
        type: string
        example: Profile fetched successfully
      user:
        $ref: '#/definitions/UserProfile'

  ErrorResponse:
    type: object
    required: [success, acknowledgement, code, message]
    properties:
      success:
        type: boolean
        example: false
      acknowledgement:
        type: string
        example: Request failed
      code:
        type: integer
        format: int32
        example: 400
      message:
        type: string
        example: Invalid request payload
        
securityDefinitions:
  Bearer:
    type: apiKey
    in: header
    name: Authorization
    description: Bearer token (e.g. "Bearer &lt;token&gt;")

security: []
